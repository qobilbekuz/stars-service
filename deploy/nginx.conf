# api.qobilbek.dev uchun nginx reverse proxy namunasi

upstream stars_api {
    server 127.0.0.1:8710;
    keepalive 32;
}

# So'rovlar limiti (nginx darajasida qo'shimcha himoya)
limit_req_zone $binary_remote_addr zone=stars_api_limit:10m rate=30r/s;

server {
    listen 443 ssl http2;
    server_name api.qobilbek.dev;

    ssl_certificate     /etc/letsencrypt/live/api.qobilbek.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.qobilbek.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/stars-api.access.log;
    error_log  /var/log/nginx/stars-api.error.log;

    location / {
        limit_req zone=stars_api_limit burst=60 nodelay;

        proxy_pass http://stars_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Admin endpointlarini faqat ishonchli IP'lardan ochish (ixtiyoriy)
    location /v1/admin/ {
        # allow 1.2.3.4;
        # deny all;
        proxy_pass http://stars_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.qobilbek.dev;
    return 301 https://$host$request_uri;
}
